version: '3.9'
services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: promptverse
      MYSQL_USER: promptverse
      MYSQL_PASSWORD: promptverse
    ports:
      - '3306:3306'
    volumes:
      - db_data:/var/lib/mysql
  web:
    build: .
    depends_on:
      - db
    environment:
      DATABASE_URL: mysql://promptverse:promptverse@db:3306/promptverse
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: change-me
      ADMIN_EMAIL: thony@example.com
      ADMIN_USERNAME: Thony
      ADMIN_PASSWORD: @Adrian[22]
    ports:
      - '3000:3000'
    command: npm run start
volumes:
  db_data:
